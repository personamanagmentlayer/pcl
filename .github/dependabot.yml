# Dependabot configuration for automated dependency updates
# https://docs.github.com/en/code-security/dependabot/dependabot-version-updates

version: 2

updates:
  # ═══════════════════════════════════════════════════════════════════════════
  #                              NPM DEPENDENCIES
  # ═══════════════════════════════════════════════════════════════════════════
  
  - package-ecosystem: "npm"
    directory: "/"
    schedule:
      interval: "weekly"
      day: "monday"
      time: "09:00"
      timezone: "UTC"
    open-pull-requests-limit: 10
    reviewers:
      - "personamanagmentlayer"
    labels:
      - "dependencies"
      - "automated"
    commit-message:
      prefix: "chore(deps)"
      include: "scope"
    # Group minor and patch updates together
    groups:
      dev-dependencies:
        patterns:
          - "@types/*"
          - "eslint*"
          - "prettier"
          - "typescript"
          - "vitest"
          - "tsup"
          - "tsx"
        update-types:
          - "minor"
          - "patch"
      production-dependencies:
        patterns:
          - "*"
        exclude-patterns:
          - "@types/*"
          - "eslint*"
          - "prettier"
          - "typescript"
          - "vitest"
          - "tsup"
          - "tsx"
        update-types:
          - "minor"
          - "patch"
    # Security updates always get their own PR
    ignore:
      - dependency-name: "*"
        update-types: ["version-update:semver-major"]
    versioning-strategy: increase

  # ═══════════════════════════════════════════════════════════════════════════
  #                              GITHUB ACTIONS
  # ═══════════════════════════════════════════════════════════════════════════
  
  - package-ecosystem: "github-actions"
    directory: "/"
    schedule:
      interval: "weekly"
      day: "monday"
      time: "10:00"
      timezone: "UTC"
    open-pull-requests-limit: 5
    reviewers:
      - "personamanagmentlayer"
    labels:
      - "dependencies"
      - "type:ci"
      - "automated"
    commit-message:
      prefix: "ci(deps)"
      include: "scope"
