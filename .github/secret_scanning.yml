# GitHub Secret Scanning Configuration
# https://docs.github.com/en/code-security/secret-scanning/about-secret-scanning

# Allow list for false positives
paths-ignore:
  - 'examples/**'
  - 'tests/**'
  - 'docs/**'
  - '**/*.test.ts'
  - '**/*.spec.ts'
  - '**/test-*.ts'

# Patterns to exclude (environment variable references)
patterns:
  - pattern: 'process\.env\.[A-Z_]+_API_KEY'
    description: 'Environment variable reference, not a hardcoded secret'

  - pattern: 'process\.env\.[A-Z_]+_SECRET'
    description: 'Environment variable reference, not a hardcoded secret'

  - pattern: "|| '[a-z-]+'"
    description: 'Test fallback value (non-functional)'

  - pattern: "'test-key'"
    description: 'Placeholder for local testing (non-functional)'

# Comments explaining patterns
# 1. Examples show how to use API keys via environment variables
# 2. No actual secrets are committed to the repository
# 3. All API keys must be provided at runtime via environment variables
