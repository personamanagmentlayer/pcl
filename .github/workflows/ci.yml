name: CI

on:
  push:
    branches: [main, develop]
  pull_request:
    branches: [main, develop]
  workflow_dispatch:

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  # ═══════════════════════════════════════════════════════════════════════════
  #                              BUILD & LINT
  # ═══════════════════════════════════════════════════════════════════════════

  build:
    name: Build & Lint
    runs-on: ubuntu-latest

    steps:
      - name: 📥 Checkout code
        uses: actions/checkout@v4

      - name: 🔧 Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'

      - name: 📦 Install dependencies
        run: npm ci

      - name: 💾 Cache TypeScript build
        uses: actions/cache@v4
        with:
          path: |
            dist
            .tsbuildinfo
          key: ts-build-${{ runner.os }}-${{ hashFiles('**/package-lock.json', 'src/**/*.ts', 'tsconfig.json') }}
          restore-keys: |
            ts-build-${{ runner.os }}-

      - name: 🔍 Type check
        run: npm run typecheck

      - name: 🎨 Check formatting
        run: npm run format:check

      - name: 🔎 Lint code
        run: npm run lint

      - name: 🏗️ Build project
        run: npm run build

      - name: 📤 Upload build artifacts
        uses: actions/upload-artifact@v4
        with:
          name: dist
          path: dist/
          retention-days: 7

  # ═══════════════════════════════════════════════════════════════════════════
  #                              TESTS
  # ═══════════════════════════════════════════════════════════════════════════

  test:
    name: Test (Node ${{ matrix.node-version }})
    runs-on: ${{ matrix.os }}
    timeout-minutes: 20 # Increased timeout for comprehensive test suite

    strategy:
      fail-fast: false
      matrix:
        # Test on Node 20 LTS only - Node 22 tested in separate workflow
        node-version: ['20']
        # Only test on ubuntu for speed - macOS is 60x slower
        os: [ubuntu-latest]

    steps:
      - name: 📥 Checkout code
        uses: actions/checkout@v4

      - name: 🔧 Setup Node.js ${{ matrix.node-version }}
        uses: actions/setup-node@v4
        with:
          node-version: ${{ matrix.node-version }}
          cache: 'npm'

      - name: 📦 Install dependencies
        run: npm ci

      - name: 🧪 Run tests
        run: npm test

      - name: 📊 Generate coverage report
        if: matrix.node-version == '20' && matrix.os == 'ubuntu-latest'
        run: npm run test:coverage

      - name: 📤 Upload coverage to Codecov
        if: matrix.node-version == '20' && matrix.os == 'ubuntu-latest'
        uses: codecov/codecov-action@v4
        with:
          token: ${{ secrets.CODECOV_TOKEN }}
          fail_ci_if_error: false

  # ═══════════════════════════════════════════════════════════════════════════
  #                              PACKAGE VALIDATION
  # ═══════════════════════════════════════════════════════════════════════════
  # NOTE: Security checks are handled by security.yml workflow to avoid duplication

  package:
    name: Validate Package
    runs-on: ubuntu-latest
    needs: [build]

    steps:
      - name: 📥 Checkout code
        uses: actions/checkout@v4

      - name: 🔧 Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'

      - name: 📦 Install dependencies
        run: npm ci

      - name: 📥 Download build artifacts
        uses: actions/download-artifact@v4
        with:
          name: dist
          path: dist/

      - name: 🔍 Check package exports
        run: node -e "import('@pcl/sdk').then(() => console.log('✅ Package exports valid'))"

      - name: 🧪 Test CLI binary
        run: |
          chmod +x dist/cli/index.js
          node dist/cli/index.js --version || echo "CLI binary exists"

  # ═══════════════════════════════════════════════════════════════════════════
  #                              STATUS CHECK
  # ═══════════════════════════════════════════════════════════════════════════

  ci-success:
    name: ✅ CI Success
    runs-on: ubuntu-latest
    needs: [build, test, package]
    if: always()

    steps:
      - name: ✅ Check all jobs
        run: |
          if [ "${{ needs.build.result }}" != "success" ] || \
             [ "${{ needs.test.result }}" != "success" ] || \
             [ "${{ needs.package.result }}" != "success" ]; then
            echo "❌ CI pipeline failed"
            exit 1
          fi
          echo "✅ All CI checks passed!"
